<line x1="411.7241379310345" y1="70" x2="411.7241379310345" y2="266" stroke="#e5e7eb" stroke-width="1"/>
<text x="411.7241379310345" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">40</text>
<line x1="527.5862068965517" y1="70" x2="527.5862068965517" y2="266" stroke="#e5e7eb" stroke-width="1"/>
<text x="527.5862068965517" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">60</text>
<text x="24" y="99" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="400">JSON-RPC envelope</text>
<rect x="180" y="80" width="420.0" height="28" fill="#9ca3af" rx="4"/>
<text x="608.0" y="99" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="600">72.5</text>
<text x="24" y="145" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="400">readable SUTRA</text>
