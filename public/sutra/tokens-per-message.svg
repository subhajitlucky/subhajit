<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" width="720" height="310" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Tokens per message by encoding</title>
<desc id="chart-desc">Bar chart: JSON-RPC 72.5 tokens, readable SUTRA 22.3, SUTRA-C 7.5, SUTRA-C meter 2.8 tokens per message.</desc>
<rect width="720" height="310" fill="#ffffff"/>
<text x="24" y="30" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#111827" text-anchor="start" font-weight="600">Tokens per message: the same six-message deal</text>
<text x="24" y="50" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">o200k_base tokenizer. Lower is better.</text>
<line x1="180.0" y1="70" x2="180.0" y2="266" stroke="#e5e7eb" stroke-width="1"/>
<text x="180.0" y="282" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">0</text>
