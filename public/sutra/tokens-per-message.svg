<text x="317.18620689655177" y="145" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="600">22.3</text>
<text x="24" y="191" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="400">SUTRA-C</text>
