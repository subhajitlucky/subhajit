<text x="240.2206896551724" y="237" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#059669" text-anchor="start" font-weight="600">25.6x cheaper</text>
<text x="180" y="302" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">One six-message buyer/seller deal. Readable SUTRA is the same language before compaction.</text>
