<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">RLS patterns across 60 open-source Supabase repositories</title>
<desc id="chart-desc">Horizontal bar chart of repository counts by RLS pattern: public read 35, RLS on with zero policies 19, public write 15, missing WITH CHECK 5, RLS off and reachable 4, TRUNCATE reachable 2, broad default privilege 1.</desc>
