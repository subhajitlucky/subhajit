<text x="24" y="30" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#111827" text-anchor="start" font-weight="600">Which RLS mistakes showed up in 60 Supabase repos</text>
<text x="24" y="50" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">Static audit of migration files, 2026-10-09. Counts are repositories with at least one instance.</text>
<text x="24" y="74" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="600">63% high/critical · 25% critical · median score 38/100</text>
