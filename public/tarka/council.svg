<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" role="img" aria-labelledby="councilTitle councilDesc">
  <title id="councilTitle">The council loop: personas, orchestration, tools, transcript, synthesis, rubric, winner</title>
  <desc id="councilDesc">A diagram of Tarka Sabha's council workflow. Personas with roles feed an orchestrator that chooses turn order and builds shared context. Tools let agents check claims. The transcript feeds three synthesis drafts with different angles, which a weighted rubric grades before the highest-scoring draft is selected.</desc>
  <rect width="720" height="360" fill="#ffffff"/>
  <text x="32" y="32" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#111827">The council loop</text>
  <text x="32" y="52" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#6b7280">Diversity of reasoning, evidence checks, and a selection rule.</text>

  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
    <rect x="32" y="76" width="140" height="70" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="44" y="100" font-size="12" font-weight="700" fill="#1d4ed8">Personas</text>
    <text x="44" y="118" font-size="10" fill="#374151">researcher · critic</text>
    <text x="44" y="133" font-size="10" fill="#374151">planner · synthesizer</text>

    <rect x="196" y="76" width="154" height="70" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="208" y="100" font-size="12" font-weight="700" fill="#111827">Orchestrator</text>
    <text x="208" y="118" font-size="10" fill="#374151">turn order + mention</text>
    <text x="208" y="133" font-size="10" fill="#374151">shared context window</text>

    <rect x="374" y="76" width="140" height="70" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="386" y="100" font-size="12" font-weight="700" fill="#111827">Tools</text>
    <text x="386" y="118" font-size="10" fill="#374151">search · fetch · math</text>
    <text x="386" y="133" font-size="10" fill="#374151">bounded, untrusted</text>

    <rect x="538" y="76" width="150" height="70" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="550" y="100" font-size="12" font-weight="700" fill="#111827">Transcript</text>
    <text x="550" y="118" font-size="10" fill="#374151">named messages</text>
    <text x="550" y="133" font-size="10" fill="#374151">“just said” anchor</text>

    <path d="M172 111 H196" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M350 111 H374" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M514 111 H538" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M613 146 V186" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>

    <rect x="32" y="196" width="180" height="90" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="44" y="220" font-size="12" font-weight="700" fill="#1d4ed8">Synthesis</text>
    <text x="44" y="238" font-size="10" fill="#374151">3 drafts, different angles</text>
    <text x="44" y="253" font-size="10" fill="#374151">decisive · risk-aware</text>
    <text x="44" y="268" font-size="10" fill="#374151">actionable</text>

    <rect x="240" y="196" width="238" height="90" rx="6" fill="#ffffff" stroke="#d1d5db"/>
    <text x="252" y="220" font-size="12" font-weight="700" fill="#111827">Rubric judge</text>
    <text x="252" y="238" font-size="10" fill="#374151">grounding .25 · coverage .25</text>
    <text x="252" y="253" font-size="10" fill="#374151">decisiveness .20 · honesty .15</text>
    <text x="252" y="268" font-size="10" fill="#374151">fit .15</text>

    <rect x="506" y="196" width="182" height="90" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="518" y="220" font-size="12" font-weight="700" fill="#15803d">Winner</text>
    <text x="518" y="238" font-size="10" fill="#374151">highest weighted score</text>
    <text x="518" y="253" font-size="10" fill="#374151">ties break deterministically</text>
    <text x="518" y="268" font-size="10" fill="#374151">all candidates stored</text>

    <path d="M212 241 H240" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
    <path d="M478 241 H506" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="32" y="322" font-size="11" fill="#6b7280">The gain is diversity plus selection — not simply more agents.</text>
    <text x="32" y="338" font-size="10" fill="#9ca3af">If a draft is weak, a second round is fed the judge’s critique and tried once more.</text>
  </g>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
