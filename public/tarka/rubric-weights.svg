<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Synthesis rubric weights</title>
<desc id="chart-desc">Horizontal bar chart of the balanced synthesis rubric: grounding 25 percent, coverage 25 percent, decisiveness 20 percent, honesty 15 percent, fit 15 percent.</desc>
<rect width="720" height="330" fill="#ffffff"/>
<text x="24" y="30" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#111827" text-anchor="start" font-weight="600">The default rubric: what the judge is told to value</text>
<text x="24" y="50" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">Balanced preset; the weights sum to 1.00.</text>
<text x="24" y="107" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="400">Grounding</text>
<rect x="250" y="90" width="380.0" height="26" fill="#2563eb" rx="4"/>
<text x="638.0" y="108" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="600">25%</text>
<text x="24" y="149" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="400">Coverage</text>
<rect x="250" y="132" width="380.0" height="26" fill="#2563eb" rx="4"/>
<text x="638.0" y="150" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="600">25%</text>
<text x="24" y="191" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="400">Decisiveness</text>
<rect x="250" y="174" width="304.0" height="26" fill="#059669" rx="4"/>
<text x="562.0" y="192" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="600">20%</text>
<text x="24" y="233" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="400">Honesty</text>
<rect x="250" y="216" width="228.0" height="26" fill="#d97706" rx="4"/>
<text x="486.0" y="234" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="600">15%</text>
<text x="24" y="275" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="400">Fit</text>
<rect x="250" y="258" width="228.0" height="26" fill="#7c3aed" rx="4"/>
<text x="486.0" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="600">15%</text>
<text x="24" y="314" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10.5" fill="#6b7280" text-anchor="start" font-weight="400">A candidate cannot win by being decisive while inventing facts.</text>
</svg>
