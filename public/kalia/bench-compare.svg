<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 424" width="720" height="424" role="img" aria-labelledby="figTitle figDesc"><title id="figTitle">Zero-shot benchmark comparison, KALIA 0.1.2 against 0.2.0</title><desc id="figDesc">Grouped bars for five zero-shot tasks, both versions, each with a grey band showing plus or minus one standard error of about two points. Three movements fall inside their own band.</desc><rect width="720" height="424" fill="#ffffff"/><text x="40.0" y="26.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="600">Zero-shot accuracy, both versions, with the measurement noise drawn in</text><text x="40.0" y="42.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">0-shot, 500 samples. The grey band is +/-1 standard error, about 2 points.</text><text x="40.0" y="56.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">Where both bars reach into the same band, the change is not real.</text><rect x="100" y="82" width="10" height="10" fill="#b45309"/><text x="115.0" y="91.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">0.1.2</text><rect x="166" y="82" width="10" height="10" fill="#2563eb"/><text x="181.0" y="91.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">0.2.0</text><rect x="250" y="81" width="22" height="12" fill="#d1d5db"/><text x="278.0" y="91.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">+/-1 std err</text><text x="86.0" y="119.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="end" font-weight="600">PIQA</text><text x="86.0" y="131.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#b45309" text-anchor="end" font-weight="400">0.1.2</text><text x="86.0" y="143.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#2563eb" text-anchor="end" font-weight="400">0.2.0</text><rect x="425.9" y="103" width="22.7" height="32" fill="#e5e7eb" opacity="0.75"/><rect x="100" y="106" width="324.5" height="11" fill="#b45309"/><text x="430.5" y="115.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#b45309" text-anchor="start" font-weight="600">61.4</text><rect x="100" y="121" width="337.2" height="11" fill="#2563eb"/><text x="443.2" y="130.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#2563eb" text-anchor="start" font-weight="600">63.8</text><line x1="364.3" y1="98" x2="364.3" y2="137" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 3"/><text x="504.0" y="124.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#15803d" text-anchor="start" font-weight="600">+2.40</text><text x="504.0" y="137.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#15803d" text-anchor="start" font-weight="400">1.1 sigma</text><text x="86.0" y="171.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="end" font-weight="600">HellaSwag</text><text x="86.0" y="183.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#b45309" text-anchor="end" font-weight="400">0.1.2</text><text x="86.0" y="195.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#2563eb" text-anchor="end" font-weight="400">0.2.0</text><rect x="299.9" y="155" width="21.0" height="32" fill="#e5e7eb" opacity="0.75"/><rect x="100" y="158" width="194.5" height="11" fill="#b45309"/><text x="300.5" y="167.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#b45309" text-anchor="start" font-weight="600">36.8</text><rect x="100" y="173" width="210.4" height="11" fill="#2563eb"/><text x="316.4" y="182.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#2563eb" text-anchor="start" font-weight="600">39.8</text><line x1="232.1" y1="150" x2="232.1" y2="189" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 3"/><text x="504.0" y="176.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#15803d" text-anchor="start" font-weight="600">+3.00</text><text x="504.0" y="189.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#15803d" text-anchor="start" font-weight="400">1.5 sigma</text><text x="86.0" y="223.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="end" font-weight="600">WinoGrande</text><text x="86.0" y="235.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#b45309" text-anchor="end" font-weight="400">0.1.2</text><text x="86.0" y="247.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#2563eb" text-anchor="end" font-weight="400">0.2.0</text><rect x="356.7" y="207" width="23.7" height="32" fill="#e5e7eb" opacity="0.75"/><rect x="100" y="210" width="265.3" height="11" fill="#b45309"/><text x="371.3" y="219.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#b45309" text-anchor="start" font-weight="600">50.2</text><rect x="100" y="225" width="268.5" height="11" fill="#2563eb"/><text x="374.5" y="234.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#2563eb" text-anchor="start" font-weight="600">50.8</text><line x1="364.3" y1="202" x2="364.3" y2="241" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 3"/><text x="504.0" y="228.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="600">+0.60</text><text x="504.0" y="241.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">inside noise</text><text x="86.0" y="275.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="end" font-weight="600">LAMBADA</text><text x="86.0" y="287.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#b45309" text-anchor="end" font-weight="400">0.1.2</text><text x="86.0" y="299.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#2563eb" text-anchor="end" font-weight="400">0.2.0</text><rect x="200.3" y="259" width="19.2" height="32" fill="#e5e7eb" opacity="0.75"/><rect x="100" y="262" width="121.6" height="11" fill="#b45309"/><text x="227.6" y="271.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#b45309" text-anchor="start" font-weight="600">23.0</text><rect x="100" y="277" width="109.9" height="11" fill="#2563eb"/><text x="215.9" y="286.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#2563eb" text-anchor="start" font-weight="600">20.8</text><text x="504.0" y="280.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="600">-2.20</text><text x="504.0" y="293.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">1.2 sigma</text><text x="86.0" y="327.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="end" font-weight="600">ARC-Easy</text><text x="86.0" y="339.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#b45309" text-anchor="end" font-weight="400">0.1.2</text><text x="86.0" y="351.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="9" fill="#2563eb" text-anchor="end" font-weight="400">0.2.0</text><rect x="310.3" y="311" width="23.4" height="32" fill="#e5e7eb" opacity="0.75"/><rect x="100" y="314" width="242.1" height="11" fill="#b45309"/><text x="348.1" y="323.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#b45309" text-anchor="start" font-weight="600">45.8</text><rect x="100" y="329" width="222.0" height="11" fill="#2563eb"/><text x="328.0" y="338.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#2563eb" text-anchor="start" font-weight="600">42.0</text><line x1="232.1" y1="306" x2="232.1" y2="345" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 3"/><text x="504.0" y="332.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="600">-3.80</text><text x="504.0" y="345.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#b91c1c" text-anchor="start" font-weight="400">1.7 sigma</text><line x1="100" y1="362" x2="670" y2="362" stroke="#e5e7eb"/><text x="40.0" y="386.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">Three of five movements are inside their own error bars, so the honest summary is no measurable change in most</text><text x="40.0" y="401.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">accuracy. The two that moved down are the signal. The registered rule allows 1.0 point of regression and v0.2.0</text><text x="40.0" y="416.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">fails it on two, which is why it is published as an experiment and not a release.</text></svg>