<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="figTitle figDesc"><title id="figTitle">KALIA training mixture and long-document coverage</title><desc id="figDesc">Stacked bar of the 2.4 billion token mixture, beside the share of each source whose documents reach the 1024 token context: 26.2 percent, 0.03 percent, 13.2 percent, and 17.7 percent overall.</desc><rect width="720" height="320" fill="#ffffff"/><text x="40.0" y="26.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="600">Training mixture, and how much of it is long enough to matter</text><text x="40.0" y="44.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">2.4B tokens, 1024-token context. Proportions are of training tokens.</text><text x="40.0" y="68.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="600">What it is made of</text><rect x="40.0" y="78" width="150.0" height="34" fill="#2563eb"/><text x="115.0" y="99.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">60%</text><rect x="190.0" y="78" width="50.0" height="34" fill="#7c3aed"/><text x="215.0" y="99.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">20%</text><rect x="240.0" y="78" width="37.5" height="34" fill="#0891b2"/><text x="258.8" y="99.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">15%</text><rect x="277.5" y="78" width="12.5" height="34" fill="#b45309"/><rect x="40" y="124" width="10" height="10" fill="#2563eb"/><text x="56.0" y="132.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">FineWeb-Edu (dedup)</text><text x="56.0" y="146.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">60%  ·  ODC-By-1.0</text><rect x="40" y="154" width="10" height="10" fill="#7c3aed"/><text x="56.0" y="162.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">TinyStories</text><text x="56.0" y="176.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">20%  ·  CDLA-Sharing-1.0</text><rect x="40" y="184" width="10" height="10" fill="#0891b2"/><text x="56.0" y="192.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">Cosmopedia v2</text><text x="56.0" y="206.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">15%  ·  Apache-2.0</text><rect x="40" y="214" width="10" height="10" fill="#b45309"/><text x="56.0" y="222.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">Python (filtered)</text><text x="56.0" y="236.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">5%  ·  per-file filter</text><text x="348.0" y="68.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="600">Documents at least as long as the context</text><text x="348.0" y="82.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">share of each source, median length in parentheses</text><text x="348.0" y="113.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">FineWeb-Edu</text><rect x="476" y="104" width="39.3" height="14" fill="#2563eb"/><text x="632.0" y="115.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">26.2%  (592)</text><text x="348.0" y="133.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">TinyStories</text><rect x="476" y="124" width="1.5" height="14" fill="#7c3aed"/><text x="632.0" y="135.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">0.03%  (192)</text><text x="348.0" y="153.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">Cosmopedia v2</text><rect x="476" y="144" width="19.8" height="14" fill="#0891b2"/><text x="632.0" y="155.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">13.2%  (669)</text><text x="348.0" y="173.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">Python</text><rect x="476" y="164" width="2" height="14" fill="#e5e7eb"/><text x="484.0" y="175.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">not measured</text><line x1="348" y1="192" x2="680" y2="192" stroke="#e5e7eb"/><text x="348.0" y="212.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">Whole mixture</text><rect x="476" y="202" width="26.6" height="14" fill="#111827"/><text x="632.0" y="213.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">17.7%</text><text x="40.0" y="262.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">LAMBADA needs the model to hold a discourse and recall its end. It is the task this</text><text x="40.0" y="278.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">corpus is worst equipped for, and it is one of the two that regressed.</text><text x="40.0" y="298.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">A candidate replacement source measures 99.3%, so the remedy is measured rather than guessed.</text></svg>