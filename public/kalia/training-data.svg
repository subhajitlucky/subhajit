<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="t d"><title id="t">KALIA training mixture and long-document coverage</title><desc id="d">Left: the 2.4 billion token mixture by source and licence. Right: the share of each source whose documents are at least as long as the 1024 token context, which is 17.7 percent overall and 0.03 percent for TinyStories.</desc><rect width="720" height="380" fill="#ffffff"/><text x="40" y="26" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="600">Training mixture, and how much of it is long enough to matter</text><text x="40" y="44" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">2.4B tokens, 1,024-token context. Proportions are of training tokens.</text><text x="40" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="600">What it is made of</text><rect x="40.0" y="74" width="150.0" height="34" fill="#2563eb"/><text x="115.0" y="95" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">60%</text><rect x="190.0" y="74" width="50.0" height="34" fill="#7c3aed"/><text x="215.0" y="95" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">20%</text><rect x="240.0" y="74" width="37.5" height="34" fill="#0891b2"/><text x="258.75" y="95" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">15%</text><rect x="277.5" y="74" width="12.5" height="34" fill="#b45309"/><rect x="40" y="118" width="10" height="10" fill="#2563eb"/><text x="56" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">FineWeb-Edu (dedup)</text><text x="216" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="400">60%</text><text x="290" y="126" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-weight="400">ODC-By-1.0</text><rect x="40" y="133" width="10" height="10" fill="#7c3aed"/><text x="56" y="141" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">TinyStories</text><text x="216" y="141" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="400">20%</text><text x="290" y="141" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-weight="400">CDLA-Sharing-1.0</text><rect x="40" y="148" width="10" height="10" fill="#0891b2"/><text x="56" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">Cosmopedia v2</text><text x="216" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="400">15%</text><text x="290" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-weight="400">Apache-2.0</text><rect x="40" y="163" width="10" height="10" fill="#b45309"/><text x="56" y="171" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">Python (filtered)</text><text x="216" y="171" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="400">5%</text><text x="290" y="171" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="end" font-weight="400">per-file filter</text><text x="348" y="66" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="600">Documents at least as long as the context</text><text x="348" y="82" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">share of each source's documents, median length in parentheses</text><text x="348" y="113" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">FineWeb-Edu</text><rect x="476" y="104" width="39.3" height="14" fill="#2563eb"/><text x="632" y="115" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">26.2%  (592)</text><text x="348" y="133" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">TinyStories</text><rect x="476" y="124" width="1.5" height="14" fill="#7c3aed"/><text x="632" y="135" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">0.03%  (192)</text><text x="348" y="153" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">Cosmopedia v2</text><rect x="476" y="144" width="19.8" height="14" fill="#0891b2"/><text x="632" y="155" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">13.2%  (669)</text><text x="348" y="173" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">Python</text><rect x="476" y="164" width="2" height="14" fill="#e5e7eb"/><text x="484" y="175" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">not measured</text><line x1="348" y1="190" x2="680" y2="190" stroke="#e5e7eb"/><text x="348" y="210" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">Whole mixture, token-weighted</text><rect x="476" y="200" width="26.6" height="14" fill="#111827"/><text x="632" y="211" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">17.7%</text><text x="348" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">LAMBADA needs the model to hold a discourse and recall its end.</text><text x="348" y="252" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">It is the task this corpus is worst equipped for, and it regressed.</text><text x="348" y="268" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">The probe found a replacement source at 99.3%.</text></svg>