<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-labelledby="figTitle figDesc"><title id="figTitle">KALIA static-gate result and its two-seed replication</title><desc id="figDesc">Grouped bars of control and static-gate validation loss at seeds 1337, 1338 and 1339. The treatment is 0.1358 nats better at seed 1337 and 0.0854 and 0.0179 nats worse at seeds 1338 and 1339, so the effect reverses sign under replication.</desc><rect width="720" height="430" fill="#ffffff"/><text x="40.0" y="26.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="600">The project's best result, and what two fresh seeds did to it</text><text x="40.0" y="42.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">30M parameters, 500 steps, paired control and treatment in the same kernel.</text><text x="40.0" y="56.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">Lower is better. The treatment bar is below the control at seed 1337 and above it at both others.</text><rect x="78" y="86" width="10" height="10" fill="#6b7280"/><text x="93.0" y="95.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">control</text><rect x="150" y="86" width="10" height="10" fill="#7c3aed"/><text x="165.0" y="95.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">static gate</text><line x1="126.2" y1="102" x2="126.2" y2="284" stroke="#e5e7eb"/><text x="126.2" y="96.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">4.6</text><line x1="222.6" y1="102" x2="222.6" y2="284" stroke="#e5e7eb"/><text x="222.6" y="96.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">4.7</text><line x1="319.0" y1="102" x2="319.0" y2="284" stroke="#e5e7eb"/><text x="319.0" y="96.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">4.8</text><line x1="415.4" y1="102" x2="415.4" y2="284" stroke="#e5e7eb"/><text x="415.4" y="96.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">4.9</text><line x1="511.8" y1="102" x2="511.8" y2="284" stroke="#e5e7eb"/><text x="511.8" y="96.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="400">5.0</text><text x="40.0" y="131.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">seed 1337</text><text x="40.0" y="145.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">X20 — the result as first seen</text><rect x="78" y="118" width="208.4" height="14" fill="#6b7280" rx="2"/><text x="293.4" y="130.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">4.7662</text><rect x="78" y="135" width="77.5" height="14" fill="#7c3aed" rx="2"/><text x="162.5" y="147.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">4.6304</text><text x="584.0" y="138.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#15803d" text-anchor="start" font-weight="600">-0.1358</text><text x="40.0" y="193.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">seed 1338</text><text x="40.0" y="207.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">X21 — replication</text><rect x="78" y="180" width="315.1" height="14" fill="#6b7280" rx="2"/><text x="400.1" y="192.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">4.8769</text><rect x="78" y="197" width="397.5" height="14" fill="#7c3aed" rx="2"/><text x="482.5" y="209.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">4.9623</text><text x="584.0" y="200.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="600">+0.0854</text><text x="40.0" y="255.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">seed 1339</text><text x="40.0" y="269.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">X21 — replication</text><rect x="78" y="242" width="328.5" height="14" fill="#6b7280" rx="2"/><text x="413.5" y="254.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">4.8908</text><rect x="78" y="259" width="345.8" height="14" fill="#7c3aed" rx="2"/><text x="430.8" y="271.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">4.9087</text><text x="584.0" y="262.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#b91c1c" text-anchor="start" font-weight="600">+0.0179</text><text x="584.0" y="116.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">Δ</text><line x1="40" y1="318" x2="680" y2="318" stroke="#e5e7eb"/><text x="40.0" y="340.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="600">The control is not seed-invariant, and nobody had measured that.</text><text x="40.0" y="360.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">Two independent sessions at seed 1337 agree to 0.0018, so the machine is not the variable.</text><text x="40.0" y="376.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">Fresh seeds land about 0.11 nats higher — larger than the −0.0436 the gated residual was</text><text x="40.0" y="392.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">credited with, and larger than the branch-norm null by an order of magnitude.</text><text x="40.0" y="414.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="600">Every single-seed delta in this project was read against a baseline that was never measured.</text></svg>