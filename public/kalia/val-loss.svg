><circle cx="697.3" cy="319.9" r="2.6" fill="#2563eb"/><line x1="519.7" y1="299.1" x2="535.7" y2="299.1" stroke="#b45309" stroke-width="2.5"/><line x1="692.0" y1="327.0" x2="708.0" y2="327.0" stroke="#2563eb" stroke-width="2.5"/><rect x="404" y="150" width="248" height="74" rx="6" fill="#ffffff" stroke="#e5e7eb"/><line x1="416" y1="168" x2="434" y2="168" stroke="#b45309" stroke-width="2.5"/><text x="442.0" y="172.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">v0.1.2</text><text x="640.0" y="172.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#b45309" text-anchor="end" font-weight="600">3.0533</text><line x1="416" y1="188" x2="434" y2="188" stroke="#2563eb" stroke-width="2.5"/><text x="442.0" y="192.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">v0.2.0</text><text x="640.0" y="192.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#2563eb" text-anchor="end" font-weight="600">2.8248</text><line x1="416" y1="206" x2="640" y2="206" stroke="#e5e7eb"/><text x="416.0" y="220.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#15803d" text-anchor="start" font-weight="600">0.2285 nats better, 4.6x the 0.05 bar</text><line x1="444" y1="224" x2="527.7" y2="290.1" stroke="#b45309" stroke-width="1" stroke-dasharray="2 3"/><line x1="640" y1="224" x2="700.0" y2="318.0" stroke="#2563eb" stroke-width="1" stroke-dasharray="2 3"/><text x="40.0" y="394.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">Same recipe, same schedule, only the corpus changed: it was rebuilt for licence compliance.</text><text x="40.0" y="410.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">Ticks are the deterministic 100-batch protocol; the curve is the 50-batch in-training estimate, which is why the last tick sits below the line.</text></svg>