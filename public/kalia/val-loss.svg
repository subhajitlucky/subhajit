<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="figTitle figDesc"><title id="figTitle">Validation loss for KALIA 0.1.2 and 0.2.0</title><desc id="figDesc">Line chart of v0.2.0 validation loss falling from 4.83 to 2.88 over 4770 steps, flat from step 3250, with deterministic reference points of 3.0533 for v0.1.2 and 2.8248 for v0.2.0 on the same rebuilt yardstick.</desc><rect width="720" height="420" fill="#ffffff"/><text x="40.0" y="26.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15" fill="#111827" text-anchor="start" font-weight="600">Validation loss, both versions on the same rebuilt yardstick</text><text x="40.0" y="44.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="400">deterministic 100-batch protocol, 819,200 tokens. v0.1.2 re-measured on the v2b set, or the two are not comparable.</text><rect x="497.3" y="74" width="202.7" height="256" fill="#6b7280" opacity="0.09"/><text x="505.3" y="89.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="600">flat for the last 1,500 steps</text><text x="505.3" y="102.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">spread 0.0653 nats over 7 evals</text><line x1="64" y1="330.0" x2="700" y2="330.0" stroke="#e5e7eb"/><text x="56.0" y="334.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="400">2.8</text><line x1="64" y1="305.6" x2="700" y2="305.6" stroke="#e5e7eb"/><text x="56.0" y="309.6" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="400">3.0</text><line x1="64" y1="281.2" x2="700" y2="281.2" stroke="#e5e7eb"/><text x="56.0" y="285.2" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="400">3.2</text><line x1="64" y1="256.9" x2="700" y2="256.9" stroke="#e5e7eb"/><text x="56.0" y="260.9" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="400">3.4</text><line x1="64" y1="232.5" x2="700" y2="232.5" stroke="#e5e7eb"/><text x="56.0" y="236.5" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="400">3.6</text><line x1="64" y1="183.7" x2="700" y2="183.7" stroke="#e5e7eb"/><text x="56.0" y="187.7" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="400">4.0</text><line x1="64" y1="122.8" x2="700" y2="122.8" stroke="#e5e7eb"/><text x="56.0" y="126.8" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="400">4.5</text><line x1="64" y1="330" x2="700" y2="330" stroke="#e5e7eb"/><line x1="64.0" y1="330" x2="64.0" y2="334" stroke="#e5e7eb"/><text x="64.0" y="349.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">0</text><line x1="197.3" y1="330" x2="197.3" y2="334" stroke="#e5e7eb"/><text x="197.3" y="349.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">1,000</text><line x1="330.7" y1="330" x2="330.7" y2="334" stroke="#e5e7eb"/><text x="330.7" y="349.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="400">2,000</text><line x1="464.0" y1="330" x2="464.0" y2="334" stroke="#e5e7eb"/><text x="464.0" y="349.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,san