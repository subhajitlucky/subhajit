<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Field study of 100 agent-configured repositories</title>
<desc id="chart-desc">Bar chart: 23 repositories had at least one high-severity finding, 11 had risky agent configuration, 10 had a broken import target, 4 had private key material, and 1 had a committed provider token.</desc>
<rect width="720" height="330" fill="#ffffff"/>
<text x="24" y="30" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" fill="#111827" text-anchor="start" font-weight="600">100 agent-configured repositories, audited</text>
<text x="24" y="50" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="400">Static offline audit, 2026-10-09. Convenience sample; shallow clones limit history scanning.</text>
<text x="24" y="74" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="12" fill="#111827" text-anchor="start" font-weight="600">23% had at least one high-severity finding. 10% had a broken import target.</text>
<text x="24" y="116" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">any high-severity finding</text>
<rect x="280" y="100" width="349.59999999999997" height="24" fill="#dc2626" stroke="3" stroke-width="1" rx="6"/>
<text x="637.5999999999999" y="116" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">23%</text>
<text x="24" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">risky agent configuration</text>
<rect x="280" y="140" width="167.2" height="24" fill="#d97706" stroke="3" stroke-width="1" rx="6"/>
<text x="455.2" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">11%</text>
<text x="24" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">broken import target</text>
<rect x="280" y="180" width="152.0" height="24" fill="#2563eb" stroke="3" stroke-width="1" rx="6"/>
<text x="440.0" y="196" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">10%</text>
<text x="24" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">private key material</text>
<rect x="280" y="220" width="60.8" height="24" fill="#dc2626" stroke="3" stroke-width="1" rx="6"/>
<text x="348.8" y="236" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">4%</text>
<text x="24" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="400">committed provider token</text>
<rect x="280" y="260" width="15.2" height="24" fill="#dc2626" stroke="3" stroke-width="1" rx="6"/>
<text x="303.2" y="276" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="11" fill="#111827" text-anchor="start" font-weight="600">1%</text>
<text x="24" y="316" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-weight="400">Counts are repositories, not findings. 24 repositories had zero findings; median Repo Health score 84/100.</text>
</svg>
